<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100">
  <defs>
    <radialGradient id="retrato" cx="50%" cy="45%" r="60%">
      <stop offset="0" stop-color="#e6ecdc"/>
      <stop offset="1" stop-color="#b9c8ab"/>
    </radialGradient>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e3eadb"/>
      <stop offset=".55" stop-color="#d3dfc6"/>
      <stop offset="1" stop-color="#e8d9bf"/>
    </linearGradient>
    <pattern id="guilhoche" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 6 Q3 0 6 6 T12 6" fill="none" stroke="#b5c6a6" stroke-width=".6"/>
    </pattern>
  </defs>
  <rect width="240" height="100" rx="5" fill="url(#fundo)"/>
  <rect width="240" height="100" rx="5" fill="url(#guilhoche)" opacity=".7"/>
  <rect x="5" y="5" width="230" height="90" rx="3" fill="none" stroke="#4f6b4b" stroke-width="1.5"/>
  <rect x="8" y="8" width="224" height="84" rx="2" fill="none" stroke="#7d9675" stroke-width=".6"/>

  <text x="120" y="17" font-family="Georgia, serif" font-size="7" font-weight="bold" text-anchor="middle" fill="#3e563b" letter-spacing="1">THE UNITED STATES OF AMERICA</text>
  <text x="120" y="91" font-family="Georgia, serif" font-size="6.5" font-weight="bold" text-anchor="middle" fill="#3e563b" letter-spacing="1.5">ONE HUNDRED DOLLARS</text>

  <!-- retrato -->
  <ellipse cx="120" cy="51" rx="27" ry="31" fill="url(#retrato)" stroke="#4f6b4b" stroke-width="1.2"/>
  <circle cx="120" cy="43" r="10" fill="#8ea284"/>
  <path d="M100 76 Q102 56 120 55 Q138 56 140 76 Z" fill="#8ea284"/>

  <!-- fita azul 3D -->
  <rect x="160" y="5" width="9" height="90" fill="#3f78c9" opacity=".9"/>
  <g fill="#9cc3f5">
    <rect x="162" y="14" width="5" height="3"/><rect x="162" y="30" width="5" height="3"/>
    <rect x="162" y="46" width="5" height="3"/><rect x="162" y="62" width="5" height="3"/>
    <rect x="162" y="78" width="5" height="3"/>
  </g>

  <!-- sino da liberdade -->
  <path d="M190 52 q0 -14 10 -14 q10 0 10 14 l3 6 h-26 z" fill="#b5803f" stroke="#7c5525" stroke-width=".8"/>
  <circle cx="200" cy="61" r="2" fill="#7c5525"/>

  <!-- valores -->
  <text x="14" y="31" font-family="Georgia, serif" font-size="17" font-weight="bold" fill="#3e563b">100</text>
  <text x="14" y="86" font-family="Georgia, serif" font-size="13" font-weight="bold" fill="#3e563b">100</text>
  <text x="227" y="31" font-family="Georgia, serif" font-size="13" font-weight="bold" text-anchor="end" fill="#3e563b">100</text>
  <text x="229" y="88" font-family="Georgia, serif" font-size="22" font-weight="bold" text-anchor="end" fill="#a8732f">100</text>
</svg>
