<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f6d5c8"/>
      <stop offset=".5" stop-color="#eebaa6"/>
      <stop offset="1" stop-color="#f3cdb9"/>
    </linearGradient>
    <pattern id="linhas" width="10" height="10" patternUnits="userSpaceOnUse" patternTransform="rotate(30)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#e4a58f" stroke-width=".7"/>
